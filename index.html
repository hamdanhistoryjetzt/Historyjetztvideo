<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: #0f0f0f;
    border-bottom: 1px solid #272727;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.5px;
  }
  .logo-mark {
    width: 28px;
    height: 20px;
    background: #ff0000;
    border-radius: 5px;
    display: grid;
    place-items: center;
  }
  .logo-mark::after {
    content: "";
    border-left: 7px solid #fff;
    border-top: 4.5px solid transparent;
    border-bottom: 4.5px solid transparent;
    margin-left: 2px;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 24px;
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 24px 60px;
  }

  /* ---------- Player ---------- */
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-title {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.35;
    margin: 16px 0 10px;
  }
  .video-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #aaa;
    font-size: 0.875rem;
    padding-bottom: 16px;
    border-bottom: 1px solid #272727;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #ff9900);
    flex-shrink: 0;
  }
  .channel-name { color: #f1f1f1; font-weight: 500; }

  /* ---------- Sidebar ---------- */
  .sidebar-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: #f1f1f1;
  }
  .rec-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .rec-card {
    display: grid;
    grid-template-columns: 168px 1fr;
    gap: 10px;
    padding: 6px;
    border-radius: 10px;
    cursor: pointer;
    background: transparent;
    border: none;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: background 0.15s ease;
  }
  .rec-card:hover { background: #1f1f1f; }
  .rec-card.active { background: #1f1f1f; }
  .rec-card.active .rec-title { color: #3ea6ff; }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #222;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .play-badge {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .rec-card:hover .play-badge { opacity: 1; }
  .play-badge svg { width: 34px; height: 34px; fill: #fff; }

  .rec-info { min-width: 0; }
  .rec-title {
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rec-sub {
    font-size: 0.78rem;
    color: #aaa;
    margin-top: 4px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 16px 12px 60px;
      gap: 20px;
    }
    .video-title { font-size: 1.05rem; }
    .rec-card { grid-template-columns: 150px 1fr; }
  }
  @media (max-width: 420px) {
    .rec-card { grid-template-columns: 130px 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark"></span>
    MyTube
  </div>
</header>

<div class="layout">

  <!-- Main player -->
  <main>
    <div class="player">
      <iframe
        id="player"
        src=""
        title="Video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <h1 class="video-title" id="mainTitle">Loading…</h1>

    <div class="video-meta">
      <div class="avatar"></div>
      <div>
        <div class="channel-name">My Channel</div>
        <div id="viewCount">Recommended for you</div>
      </div>
    </div>
  </main>

  <!-- Recommendations -->
  <aside>
    <h2 class="sidebar-title">Recommended</h2>
    <div class="rec-list" id="recList"></div>
  </aside>

</div>

<script>
  /* ---------- Your videos ---------- */
  const VIDEOS = [
    { id: "rzQNLGIb6wI" },
    { id: "K2AUo8ShkNg" },
    { id: "gO16NAvdH3U" },
    { id: "YTUweaAqaiM" },
    { id: "4qMEl5R-LMI" },
    { id: "m9UKyhbsT9U" },
    { id: "zNs7Mqe7Z0A" },
    { id: "n1afpoOYXSw" },
    { id: "7DkPYixPUf4" }
  ];

  const player    = document.getElementById("player");
  const recList   = document.getElementById("recList");
  const mainTitle = document.getElementById("mainTitle");
  const viewCount = document.getElementById("viewCount");

  let currentId = null;

  /* ---------- Try to get real titles from YouTube ---------- */
  async function fetchTitle(id) {
    try {
      const url = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("no oembed");
      const data = await res.json();
      return data.title;
    } catch {
      return null;
    }
  }

  /* ---------- Build sidebar ---------- */
  function buildSidebar() {
    VIDEOS.forEach((video, i) => {
      const card = document.createElement("button");
      card.className = "rec-card";
      card.dataset.id = video.id;
      card.innerHTML = `
        <div class="thumb">
          <img src="https://i.ytimg.com/vi/${video.id}/mqdefault.jpg" alt="" loading="lazy">
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="rec-info">
          <div class="rec-title">${video.title || "Video " + (i + 1)}</div>
          <div class="rec-sub">My Channel</div>
        </div>
      `;
      card.addEventListener("click", () => loadVideo(video.id, video.title));
      recList.appendChild(card);

      // Load real title in the background (updates both list + player if needed)
      if (!video.title) {
        fetchTitle(video.id).then(title => {
          if (title) {
            video.title = title;
            card.querySelector(".rec-title").textContent = title;
            if (currentId === video.id) mainTitle.textContent = title;
          }
        });
      }
    });
  }

  /* ---------- Switch video ---------- */
  function loadVideo(id, title) {
    currentId = id;
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
    mainTitle.textContent = title || "Loading…";
    viewCount.textContent = "Recommended for you";

    document.querySelectorAll(".rec-card").forEach(card => {
      card.classList.toggle("active", card.dataset.id === id);
    });

    // If title wasn't known yet, fetch it
    if (!title) {
      const v = VIDEOS.find(x => x.id === id);
      fetchTitle(id).then(t => {
        if (t) {
          if (v) v.title = t;
          if (currentId === id) mainTitle.textContent = t;
          const card = document.querySelector(`.rec-card[data-id="${id}"] .rec-title`);
          if (card) card.textContent = t;
        }
      });
    }
  }

  /* ---------- Start with a random-ish first video ---------- */
  buildSidebar();
  loadVideo(VIDEOS[0].id, VIDEOS[0].title);
</script>

</body>
</html>
