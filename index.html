<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg-hover: #272727;
    --text: #f1f1f1;
    --text-dim: #aaaaaa;
    --accent: #3ea6ff;
    --red: #ff0033;
    --border: #272727;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 16px;
    background: var(--bg);
  }
  .header-left { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: transparent; color: var(--text);
    display: grid; place-items: center; cursor: pointer;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

  .logo {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px;
  }
  .logo-mark {
    position: relative; width: 30px; height: 21px;
    background: var(--red); border-radius: 5px;
    display: grid; place-items: center;
  }
  .logo-mark::after {
    content: ""; border-left: 8px solid #fff;
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    margin-left: 2px;
  }

  .header-center { flex: 1; display: flex; justify-content: center; max-width: 720px; margin: 0 auto; }
  .search-box { display: flex; width: 100%; max-width: 640px; }
  .search-box input {
    flex: 1; height: 40px; padding: 0 16px;
    background: #121212; border: 1px solid #303030; border-right: none;
    border-radius: 20px 0 0 20px; color: var(--text);
    font-size: 0.95rem; outline: none;
  }
  .search-box input:focus { border-color: #1c62b9; }
  .search-btn {
    width: 64px; height: 40px;
    border: 1px solid #303030; border-radius: 0 20px 20px 0;
    background: #222; color: var(--text); cursor: pointer;
    display: grid; place-items: center;
  }
  .search-btn:hover { background: #303030; }
  .search-btn svg { width: 22px; height: 22px; fill: currentColor; }

  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .avatar-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #ff9900);
    border: none; cursor: pointer;
  }

  /* LAYOUT */
  .app { display: flex; min-height: calc(100vh - 56px); }

  /* SIDEBAR */
  .nav {
    width: 240px; padding: 12px; flex-shrink: 0;
    position: sticky; top: 56px;
    height: calc(100vh - 56px); overflow-y: auto;
  }
  .nav-item {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 12px; border-radius: 10px;
    color: var(--text); text-decoration: none;
    font-size: 0.9rem; cursor: pointer;
    transition: background 0.15s;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { background: var(--bg-hover); font-weight: 500; }
  .nav-item svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
  .nav-divider { height: 1px; background: var(--border); margin: 12px 0; }
  .nav-section-title { padding: 8px 12px 6px; font-size: 0.95rem; font-weight: 600; }

  /* CONTENT */
  .content { flex: 1; min-width: 0; padding: 0 24px 48px; }

  /* Chips */
  .chips {
    display: flex; gap: 12px; padding: 12px 0 20px;
    overflow-x: auto; scrollbar-width: none;
    position: sticky; top: 56px;
    background: var(--bg); z-index: 5;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 14px; background: var(--bg-hover);
    border: none; border-radius: 8px; color: var(--text);
    font-size: 0.875rem; font-weight: 500; white-space: nowrap;
    cursor: pointer; transition: background 0.15s;
  }
  .chip:hover { background: #3a3a3a; }
  .chip.active { background: #f1f1f1; color: #0f0f0f; }

  /* HERO */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: 24px; margin-bottom: 40px;
  }
  .hero-player {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .hero-player iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }
  .hero-title {
    font-size: 1.35rem; font-weight: 600;
    line-height: 1.3; margin: 16px 0 12px;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .channel { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
  .channel-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #ff9900);
    flex-shrink: 0;
  }
  .channel-name { font-weight: 500; font-size: 0.95rem; }

  .actions { display: flex; gap: 8px; }
  .action-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; background: var(--bg-hover);
    border: none; border-radius: 18px; color: var(--text);
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
    transition: background 0.15s; text-decoration: none;
  }
  .action-btn:hover { background: #3a3a3a; }
  .action-btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* UP NEXT */
  .up-next-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
  .up-next-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100vh - 200px); overflow-y: auto; padding-right: 4px;
  }
  .up-next-list::-webkit-scrollbar { width: 8px; }
  .up-next-list::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }

  .up-next-card {
    display: grid; grid-template-columns: 168px 1fr; gap: 10px;
    padding: 6px; border-radius: 10px; background: transparent;
    border: none; text-align: left; color: inherit;
    font: inherit; cursor: pointer; transition: background 0.15s;
  }
  .up-next-card:hover { background: var(--bg-hover); }
  .up-next-card.active { background: var(--bg-hover); }
  .up-next-card.active .up-next-name { color: var(--accent); }

  .thumb {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 8px; overflow: hidden; background: #222; flex-shrink: 0;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; transition: transform 0.3s ease;
  }
  .up-next-card:hover .thumb img { transform: scale(1.05); }

  .up-next-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .up-next-name {
    font-size: 0.9rem; font-weight: 500; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .up-next-channel { font-size: 0.78rem; color: var(--text-dim); }

  /* GRID */
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .section-header h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px 16px;
  }
  .video-card {
    display: flex; flex-direction: column; gap: 12px;
    cursor: pointer; background: none; border: none;
    padding: 0; text-align: left; color: inherit;
    font: inherit; border-radius: 8px;
    transition: transform 0.2s ease;
  }
  .video-card:hover { transform: translateY(-2px); }
  .video-card.active .card-title { color: var(--accent); }

  .card-thumb {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: var(--radius); overflow: hidden; background: #222;
  }
  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; transition: transform 0.4s ease;
  }
  .video-card:hover .card-thumb img { transform: scale(1.06); }

  .card-row { display: flex; gap: 12px; }
  .card-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #ff9900);
    flex-shrink: 0;
  }
  .card-info { min-width: 0; flex: 1; }
  .card-title {
    font-size: 0.95rem; font-weight: 500; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 4px; transition: color 0.15s;
  }
  .card-channel { font-size: 0.85rem; color: var(--text-dim); }

  /* EMPTY STATE */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state h3 { color: var(--text); margin-bottom: 8px; font-size: 1.1rem; }
  .empty-state p { font-size: 0.9rem; }

  /* RESPONSIVE */
  @media (max-width: 1200px) {
    .hero { grid-template-columns: 1fr; }
    .up-next-list { max-height: none; }
  }
  @media (max-width: 900px) {
    .nav { display: none; }
    .content { padding: 0 16px 40px; }
  }
  @media (max-width: 640px) {
    .header-center { display: none; }
    .hero-title { font-size: 1.1rem; }
    .video-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="logo">
      <span class="logo-mark"></span>
      MyTube
    </div>
  </div>

  <div class="header-center">
    <div class="search-box">
      <input type="text" placeholder="Search videos" id="searchInput">
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <div class="header-right">
    <a class="icon-btn" href="https://github.com/hamdanhistoryjetzt" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.7 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
    </a>
  </div>
</header>

<div class="app">

  <nav class="nav">
    <a class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M4 10v11h6v-6h4v6h6V10L12 3z"/></svg>
      Home
    </a>
    <a class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 8l6 4-6 4zM2 4h20v16H2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      Shorts
    </a>
    <a class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      Subscriptions
    </a>
    <div class="nav-divider"></div>
    <div class="nav-section-title">You</div>
    <a class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 3v10l4 2M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      History
    </a>
    <a class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Watch later
    </a>
  </nav>

  <main class="content">

    <div class="chips" id="chips">
      <button class="chip active" data-cat="all">All</button>
      <button class="chip" data-cat="music">Music</button>
      <button class="chip" data-cat="gaming">Gaming</button>
      <button class="chip" data-cat="news">News</button>
      <button class="chip" data-cat="podcast">Podcasts</button>
      <button class="chip" data-cat="history">History</button>
    </div>

    <section class="hero">
      <div>
        <div class="hero-player">
          <iframe
            id="player"
            src=""
            title="Video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <h1 class="hero-title" id="heroTitle">Loading…</h1>

        <div class="hero-meta">
          <div class="channel">
            <div class="channel-avatar"></div>
            <div>
              <div class="channel-name">My Channel</div>
            </div>
          </div>

          <div class="actions">
            <a class="action-btn" id="ytLink" href="#" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M10 15l5.2-3L10 9v6zM21.6 7.2c-.2-.8-.9-1.4-1.7-1.6C18.3 5.2 12 5.2 12 5.2s-6.3 0-7.9.4c-.8.2-1.5.8-1.7 1.6C2 8.8 2 12 2 12s0 3.2.4 4.8c.2.8.9 1.4 1.7 1.6 1.6.4 7.9.4 7.9.4s6.3 0 7.9-.4c.8-.2 1.5-.8 1.7-1.6.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z"/></svg>
              Watch on YouTube
            </a>
            <button class="action-btn" id="copyBtn">
              <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg>
              Copy link
            </button>
          </div>
        </div>
      </div>

      <aside>
        <h2 class="up-next-title">Up next</h2>
        <div class="up-next-list" id="upNextList"></div>
      </aside>
    </section>

    <section>
      <div class="section-header">
        <h2 id="sectionTitle">All videos</h2>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </section>

  </main>
</div>

<script>
  /* ============================================================
     YOUR VIDEOS
     - id: the YouTube video ID (required)
     - cat: category — must match a chip's data-cat
     - title: optional. Leave out and it's fetched from YouTube.
     ============================================================ */
  const VIDEOS = [
    { id: "rzQNLGIb6wI", cat: "music"   },
    { id: "K2AUo8ShkNg", cat: "gaming"  },
    { id: "gO16NAvdH3U", cat: "news"    },
    { id: "YTUweaAqaiM", cat: "music"   },
    { id: "4qMEl5R-LMI", cat: "podcast" },
    { id: "m9UKyhbsT9U", cat: "gaming"  },
    { id: "zNs7Mqe7Z0A", cat: "music"   },
    { id: "n1afpoOYXSw", cat: "history" },
    { id: "7DkPYixPUf4", cat: "history" }
  ];

  const player      = document.getElementById("player");
  const heroTitle   = document.getElementById("heroTitle");
  const upNextList  = document.getElementById("upNextList");
  const videoGrid   = document.getElementById("videoGrid");
  const searchInput = document.getElementById("searchInput");
  const searchBtn   = document.getElementById("searchBtn");
  const chipsEl     = document.getElementById("chips");
  const sectionTitle= document.getElementById("sectionTitle");
  const ytLink      = document.getElementById("ytLink");
  const copyBtn     = document.getElementById("copyBtn");

  let currentId   = null;
  let currentCat  = "all";
  let currentQuery= "";

  const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  const thumbHD = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

  /* ---------- Fetch real title from YouTube (no key needed) ---------- */
  async function fetchTitle(id) {
    try {
      const res = await fetch(
        `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`
      );
      if (!res.ok) throw 0;
      const data = await res.json();
      return data.title;
    } catch { return null; }
  }

  /* ---------- Filter logic ---------- */
  function matches(v) {
    const catOk = currentCat === "all" || v.cat === currentCat;
    const q = currentQuery.trim().toLowerCase();
    const titleOk = !q || (v.title || "").toLowerCase().includes(q);
    return catOk && titleOk;
  }

  /* ---------- Render grid ---------- */
  function renderGrid() {
    videoGrid.innerHTML = "";
    const visible = VIDEOS.filter(matches);

    if (visible.length === 0) {
      videoGrid.innerHTML = `
        <div class="empty-state">
          <h3>No videos found</h3>
          <p>Try a different search or category.</p>
        </div>`;
      return;
    }

    visible.forEach((v, i) => {
      const card = document.createElement("button");
      card.className = "video-card" + (v.id === currentId ? " active" : "");
      card.dataset.id = v.id;
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${thumbHD(v.id)}" loading="lazy" alt="">
        </div>
        <div class="card-row">
          <div class="card-avatar"></div>
          <div class="card-info">
            <div class="card-title">${v.title || "Video " + (i+1)}</div>
            <div class="card-channel">My Channel</div>
          </div>
        </div>`;
      card.addEventListener("click", () => {
        loadVideo(v.id, v.title);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      videoGrid.appendChild(card);
    });
  }

  /* ---------- Render up next ---------- */
  function renderUpNext() {
    upNextList.innerHTML = "";
    const visible = VIDEOS.filter(matches);

    if (visible.length === 0) {
      upNextList.innerHTML = `<div style="color:var(--text-dim);font-size:0.85rem;padding:8px;">No matches.</div>`;
      return;
    }

    visible.forEach((v, i) => {
      const card = document.createElement("button");
      card.className = "up-next-card" + (v.id === currentId ? " active" : "");
      card.dataset.id = v.id;
      card.innerHTML = `
        <div class="thumb">
          <img src="${thumb(v.id)}" loading="lazy" alt="">
        </div>
        <div class="up-next-info">
          <div class="up-next-name">${v.title || "Video " + (i+1)}</div>
          <div class="up-next-channel">My Channel</div>
        </div>`;
      card.addEventListener("click", () => loadVideo(v.id, v.title));
      upNextList.appendChild(card);
    });
  }

  /* ---------- Load a video ---------- */
  function loadVideo(id, title) {
    currentId = id;
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
    heroTitle.textContent = title || "Loading…";
    ytLink.href = `https://www.youtube.com/watch?v=${id}`;

    document.querySelectorAll("[data-id]").forEach(c => {
      c.classList.toggle("active", c.dataset.id === id);
    });

    if (!title) {
      const v = VIDEOS.find(x => x.id === id);
      fetchTitle(id).then(t => {
        if (!t) return;
        if (v) v.title = t;
        if (currentId === id) heroTitle.textContent = t;
        document.querySelectorAll(`[data-id="${id}"]`).forEach(card => {
          const el = card.querySelector(".up-next-name, .card-title");
          if (el) el.textContent = t;
        });
      });
    }
  }

  /* ---------- Search ---------- */
  function applySearch() {
    currentQuery = searchInput.value;
    renderGrid();
    renderUpNext();
  }
  searchInput.addEventListener("input", applySearch);
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") applySearch();
  });
  searchBtn.addEventListener("click", applySearch);

  /* ---------- Chips ---------- */
  chipsEl.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    chipsEl.querySelector(".chip.active")?.classList.remove("active");
    chip.classList.add("active");
    currentCat = chip.dataset.cat;
    sectionTitle.textContent =
      currentCat === "all" ? "All videos"
      : chip.textContent.trim();
    renderGrid();
    renderUpNext();
  });

  /* ---------- Copy link ---------- */
  copyBtn.addEventListener("click", async () => {
    if (!currentId) return;
    const url = `https://www.youtube.com/watch?v=${currentId}`;
    try {
      await navigator.clipboard.writeText(url);
      const original = copyBtn.innerHTML;
      copyBtn.innerHTML = "Copied!";
      setTimeout(() => { copyBtn.innerHTML = original; }, 1500);
    } catch {
      prompt("Copy this link:", url);
    }
  });

  /* ---------- Init ---------- */
  renderGrid();
  renderUpNext();
  loadVideo(VIDEOS[0].id, VIDEOS[0].title);

  /* ---------- Load real titles in the background ---------- */
  VIDEOS.forEach(v => {
    if (v.title) return;
    fetchTitle(v.id).then(t => {
      if (!t) return;
      v.title = t;
      document.querySelectorAll(`[data-id="${v.id}"]`).forEach(card => {
        const el = card.querySelector(".up-next-name, .card-title");
        if (el) el.textContent = t;
      });
      if (currentId === v.id) heroTitle.textContent = t;
    });
  });
</script>

</body>
</html>
